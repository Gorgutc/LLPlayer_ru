name: "Build & Package"
description: "Builds the solution, clean, archive with 7z"
inputs:
  archive-name:
    description: 'archive name including extension'
    required: true
  yt-dlp-version:
    description: 'yt-dlp version to download'
    required: false
    default: '2025.08.20'
runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore .\LLPlayer\LLPlayer.csproj /p:PublishReadyToRun=true -warnaserror

    - name: Build App
      shell: pwsh
      run: |
        dotnet msbuild .\LLPlayer\LLPlayer.csproj `
          /t:Publish `
          /p:PublishProfile=FolderProfile `
          /p:PublishDir=${{ runner.temp }}\publish `
          /warnaserror

    - name: Clean build
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"

        # Clean-up whisper.net
        $pathsToRemove = @(
          "$pub\runtimes\noavx\linux-x64"
          "$pub\runtimes\noavx\win-x86"
          "$pub\runtimes\openvino\linux-x64"
          "$pub\runtimes\vulkan\linux-x64"
          "$pub\runtimes\win-arm64"
          "$pub\runtimes\win-x86"
        )
        Remove-Item -Recurse $pathsToRemove

        # Clean-up TesseractOCR
        Remove-Item -Recurse "$pub\x86"

        # Copy FFmpeg
        Copy-Item .\FFmpeg -Destination $pub -Recurse

    - name: Restore dependencies for Plugins
      shell: pwsh
      run: |
        dotnet restore .\Plugins\YoutubeDL\YoutubeDL.csproj /p:PublishReadyToRun=true -warnaserror

    - name: Build Plugins
      shell: pwsh
      run: |
        dotnet msbuild .\Plugins\YoutubeDL\YoutubeDL.csproj `
          /t:Publish `
          /p:PublishProfile=FolderProfile `
          /p:PublishDir=${{ runner.temp }}\publish-YoutubeDL `
          /warnaserror

    - name: Copy Plugin DLLs
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"
        $pubY = "${{ runner.temp }}\publish-YoutubeDL"
        New-Item -ItemType Directory -Path "$pub\Plugins\YoutubeDL"
        Copy-Item "$pubY\YoutubeDL.dll","$pubY\YoutubeDL.pdb" -Destination "$pub\Plugins\YoutubeDL"

    # - name: Get latest yt-dlp release
    #   id: fetch-yt
    #   uses: pozetroninc/github-action-get-latest-release@master
    #   with:
    #     repository: yt-dlp/yt-dlp
    #     excludes: prerelease,draft

    - name: Download yt-dlp.exe
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"
        # $ver = "${{ steps.fetch-yt.outputs.release }}"
        $ver = "${{ inputs.yt-dlp-version }}"
        $url = "https://github.com/yt-dlp/yt-dlp/releases/download/$ver/yt-dlp.exe"
        $outDir = "$pub\Plugins\YoutubeDL"
        New-Item -Path "$outDir\yt-dlp.exe_here" -ItemType File
        Invoke-WebRequest -Uri "$url" -OutFile "$outDir\yt-dlp.exe"

    - name: Validate release contents
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"
        foreach ($requiredFile in @(
          "LLPlayer.exe"
          "lib\7z.dll"
          "FFmpeg\avcodec-62.dll"
          "FFmpeg\avdevice-62.dll"
          "FFmpeg\avfilter-11.dll"
          "FFmpeg\avformat-62.dll"
          "FFmpeg\avutil-60.dll"
          "FFmpeg\swresample-6.dll"
          "FFmpeg\swscale-9.dll"
          "Plugins\YoutubeDL\YoutubeDL.dll"
          "Plugins\YoutubeDL\YoutubeDL.pdb"
          "Plugins\YoutubeDL\yt-dlp.exe_here"
          "Plugins\YoutubeDL\yt-dlp.exe"
          "dub_sidecar\server.py"
          "dub_sidecar\pyproject.toml"
          "dub_sidecar\uv.lock"
          "dub_sidecar\README.md"
        )) {
          if (-not (Test-Path (Join-Path $pub $requiredFile))) {
            throw "Release package is missing required file $requiredFile."
          }
        }

        $forbiddenDubRuntimeDirs = @(Get-ChildItem $pub -Directory -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -in @("DubEngine", "dubmodels") })
        if ($forbiddenDubRuntimeDirs.Count -gt 0) {
          throw "Release package must not include dubbing runtime data folder(s): $($forbiddenDubRuntimeDirs.FullName -join ', ')."
        }

        $publishedDubOutputs = @(Get-ChildItem $pub -Filter "*.ru.dub.*" -Recurse -ErrorAction SilentlyContinue)
        if ($publishedDubOutputs.Count -gt 0) {
          throw "Release package must not include rendered dub output(s): $($publishedDubOutputs.FullName -join ', ')."
        }

    - name: Archive with 7-Zip
      id: archive
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"
        $out = "${{ inputs.archive-name }}"
        & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=8 -mmt=4 "$out" "$pub\*"
