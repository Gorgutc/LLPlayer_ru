name: "Build & Package"
description: "Builds the solution, clean, archive with 7z"
inputs:
  archive-name:
    description: 'archive name including extension'
    required: true
  yt-dlp-version:
    description: 'Explicit yt-dlp version to bundle (pin). Leave empty to resolve the latest release at build time.'
    required: false
    default: ''
outputs:
  yt-dlp-version:
    description: 'Resolved yt-dlp release version bundled in the package.'
    value: ${{ steps.fetch-yt.outputs.version }}
  yt-dlp-sha256:
    description: 'Lowercase SHA-256 of the bundled yt-dlp.exe.'
    value: ${{ steps.download-yt.outputs.sha256 }}
  yt-dlp-size:
    description: 'Byte size of the bundled yt-dlp.exe.'
    value: ${{ steps.download-yt.outputs.size }}
  archive-sha256:
    description: 'Lowercase SHA-256 of the tested release archive.'
    value: ${{ steps.archive.outputs.sha256 }}
  archive-size:
    description: 'Byte size of the tested release archive.'
    value: ${{ steps.archive.outputs.size }}
runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore .\LLPlayer\LLPlayer.csproj /p:PublishReadyToRun=true -warnaserror

    - name: Build App
      shell: pwsh
      run: |
        dotnet msbuild .\LLPlayer\LLPlayer.csproj `
          /t:Publish `
          /p:PublishProfile=FolderProfile `
          /p:PublishDir=${{ runner.temp }}\publish `
          /warnaserror

    - name: Clean build
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"

        # Clean-up whisper.net
        $pathsToRemove = @(
          "$pub\runtimes\noavx\linux-x64"
          "$pub\runtimes\noavx\win-x86"
          "$pub\runtimes\openvino\linux-x64"
          "$pub\runtimes\vulkan\linux-x64"
          "$pub\runtimes\win-arm64"
          "$pub\runtimes\win-x86"
        )
        Remove-Item -Recurse $pathsToRemove

        # Clean-up TesseractOCR
        Remove-Item -Recurse "$pub\x86"

        # Copy FFmpeg
        Copy-Item .\FFmpeg -Destination $pub -Recurse

    - name: Restore dependencies for Plugins
      shell: pwsh
      run: |
        dotnet restore .\Plugins\YoutubeDL\YoutubeDL.csproj /p:PublishReadyToRun=true -warnaserror

    - name: Build Plugins
      shell: pwsh
      run: |
        dotnet msbuild .\Plugins\YoutubeDL\YoutubeDL.csproj `
          /t:Publish `
          /p:PublishProfile=FolderProfile `
          /p:PublishDir=${{ runner.temp }}\publish-YoutubeDL `
          /warnaserror

    - name: Copy Plugin DLLs
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"
        $pubY = "${{ runner.temp }}\publish-YoutubeDL"
        New-Item -ItemType Directory -Path "$pub\Plugins\YoutubeDL"
        Copy-Item "$pubY\YoutubeDL.dll","$pubY\YoutubeDL.pdb" -Destination "$pub\Plugins\YoutubeDL"

    - name: Resolve yt-dlp version
      id: fetch-yt
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        YTDLP_VERSION: ${{ inputs.yt-dlp-version }}
      run: |
        # HC-12: a hard-coded default pin ships a ~year-old yt-dlp that almost certainly fails on current
        # YouTube (nsig/player). Resolve the latest release at build time (logged for traceability). An explicit
        # yt-dlp-version input still pins a specific version for a reproducible build. The input is read from an
        # env var (not expression-interpolated into the script) to avoid GitHub Actions script injection.
        $pinned = "$env:YTDLP_VERSION".Trim()
        if ($pinned) {
          $ver = $pinned
          Write-Host "Using pinned yt-dlp version: $ver"
        } else {
          $headers = @{ "User-Agent" = "LLPlayer-build"; "Accept" = "application/vnd.github+json" }
          if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest" -Headers $headers
          $ver = "$($rel.tag_name)".Trim()
          Write-Host "Resolved latest yt-dlp release: $ver"
        }
        if (-not $ver) { throw "Could not resolve a yt-dlp version to bundle." }
        # Fail closed on anything that is not a plain version token (defense in depth for the URL + output).
        if ($ver -notmatch '^[0-9A-Za-z._-]+$') { throw "Unexpected yt-dlp version format: '$ver'." }
        "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Download yt-dlp.exe
      id: download-yt
      shell: pwsh
      env:
        YTDLP_VERSION: ${{ steps.fetch-yt.outputs.version }}
      run: |
        $pub = "${{ runner.temp }}\publish"
        # Read the resolved version from an env var (not expression-interpolated) — same injection-safe pattern.
        $ver = "$env:YTDLP_VERSION"
        $url = "https://github.com/yt-dlp/yt-dlp/releases/download/$ver/yt-dlp.exe"
        $outDir = "$pub\Plugins\YoutubeDL"
        New-Item -Path "$outDir\yt-dlp.exe_here" -ItemType File
        Invoke-WebRequest -Uri "$url" -OutFile "$outDir\yt-dlp.exe"
        $ytDlpPath = "$outDir\yt-dlp.exe"

        $ytDlpFile = Get-Item -LiteralPath "$ytDlpPath"
        if ($ytDlpFile.PSIsContainer -or
            (($ytDlpFile.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) -or
            $ytDlpFile.Length -le 0) {
          throw "Downloaded yt-dlp.exe must be one non-empty regular file."
        }

        $sha256 = (Get-FileHash -LiteralPath "$ytDlpPath" -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($sha256 -notmatch '^[0-9a-f]{64}$') {
          throw "Could not calculate a valid SHA-256 for yt-dlp.exe."
        }

        [System.IO.File]::AppendAllText(
          $env:GITHUB_OUTPUT,
          "sha256=$sha256$([Environment]::NewLine)size=$($ytDlpFile.Length)$([Environment]::NewLine)",
          [System.Text.UTF8Encoding]::new($false))

    - name: Validate release contents
      shell: pwsh
      run: |
        $pub = "${{ runner.temp }}\publish"
        foreach ($requiredFile in @(
          "LLPlayer.exe"
          "lib\7z.dll"
          "lib\license.7z.txt"
          # F-19 slice 2: bundled Silero VAD model + ONNX Runtime native lib must ship (else cue-timing VAD
          # snapping silently no-ops on end-user machines). Fail closed if either is missing from the package.
          "Assets\silero_vad.onnx"
          "onnxruntime.dll"
          "onnxruntime_providers_shared.dll"
          "e_sqlite3.dll"
          "x64\leptonica-1.85.0.dll"
          "x64\tesseract55.dll"
          "runtimes\win-x64\ggml-base-whisper.dll"
          "runtimes\win-x64\ggml-cpu-whisper.dll"
          "runtimes\win-x64\ggml-whisper.dll"
          "runtimes\win-x64\whisper.dll"
          "runtimes\noavx\win-x64\ggml-base-whisper.dll"
          "runtimes\noavx\win-x64\ggml-cpu-whisper.dll"
          "runtimes\noavx\win-x64\ggml-whisper.dll"
          "runtimes\noavx\win-x64\whisper.dll"
          "runtimes\openvino\win-x64\ggml-base-whisper.dll"
          "runtimes\openvino\win-x64\ggml-cpu-whisper.dll"
          "runtimes\openvino\win-x64\ggml-whisper.dll"
          "runtimes\openvino\win-x64\whisper.dll"
          "runtimes\vulkan\win-x64\ggml-base-whisper.dll"
          "runtimes\vulkan\win-x64\ggml-cpu-whisper.dll"
          "runtimes\vulkan\win-x64\ggml-vulkan-whisper.dll"
          "runtimes\vulkan\win-x64\ggml-whisper.dll"
          "runtimes\vulkan\win-x64\whisper.dll"
          "runtimes\cuda\win-x64\ggml-base-whisper.dll"
          "runtimes\cuda\win-x64\ggml-cpu-whisper.dll"
          "runtimes\cuda\win-x64\ggml-cuda-whisper.dll"
          "runtimes\cuda\win-x64\ggml-whisper.dll"
          "runtimes\cuda\win-x64\whisper.dll"
          "FFmpeg\avcodec-62.dll"
          "FFmpeg\avdevice-62.dll"
          "FFmpeg\avfilter-11.dll"
          "FFmpeg\avformat-62.dll"
          "FFmpeg\avutil-60.dll"
          "FFmpeg\swresample-6.dll"
          "FFmpeg\swscale-9.dll"
          "Plugins\YoutubeDL\YoutubeDL.dll"
          "Plugins\YoutubeDL\YoutubeDL.pdb"
          "Plugins\YoutubeDL\yt-dlp.exe_here"
          "Plugins\YoutubeDL\yt-dlp.exe"
          "dub_sidecar\server.py"
          "dub_sidecar\pyproject.toml"
          "dub_sidecar\uv.lock"
          "dub_sidecar\README.md"
        )) {
          $requiredPath = Join-Path $pub $requiredFile
          if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
            throw "Release package is missing required file $requiredFile."
          }
          $requiredItem = Get-Item -LiteralPath $requiredPath
          if (($requiredItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Release package contains a reparse-point required file $requiredFile."
          }
          # yt-dlp.exe_here is the intentional zero-byte discovery marker used by the plugin; every real
          # runtime/source/legal file must be non-empty.
          if ($requiredFile -ne "Plugins\YoutubeDL\yt-dlp.exe_here" -and
              $requiredItem.Length -le 0) {
            throw "Release package contains an empty required file $requiredFile."
          }
        }

        $forbiddenDubRuntimeDirs = @(Get-ChildItem $pub -Directory -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -in @("DubEngine", "dubmodels") })
        if ($forbiddenDubRuntimeDirs.Count -gt 0) {
          throw "Release package must not include dubbing runtime data folder(s): $($forbiddenDubRuntimeDirs.FullName -join ', ')."
        }

        $publishedDubOutputs = @(Get-ChildItem $pub -Filter "*.ru.dub.*" -Recurse -ErrorAction SilentlyContinue)
        if ($publishedDubOutputs.Count -gt 0) {
          throw "Release package must not include rendered dub output(s): $($publishedDubOutputs.FullName -join ', ')."
        }

        $publishedVoiceAssignments = @(Get-ChildItem $pub -Filter "*.ru.voices.json" -Recurse -ErrorAction SilentlyContinue)
        if ($publishedVoiceAssignments.Count -gt 0) {
          throw "Release package must not include per-line voice assignment file(s): $($publishedVoiceAssignments.FullName -join ', ')."
        }

    - name: Archive with 7-Zip
      id: archive
      shell: pwsh
      env:
        ARCHIVE_NAME: ${{ inputs.archive-name }}
      run: |
        $pub = "${{ runner.temp }}\publish"
        $out = "$env:ARCHIVE_NAME"
        if ($out -notmatch '^LLPlayer-[0-9A-Za-z][0-9A-Za-z._+\-]{0,139}\.7z$' -or $out.Contains("..")) {
          throw "Archive name must be a single path-safe LLPlayer-*.7z basename."
        }
        $sevenZip = "C:\Program Files\7-Zip\7z.exe"
        $archivePath = [System.IO.Path]::GetFullPath((Join-Path (Get-Location) $out))
        if (Test-Path -LiteralPath $archivePath) {
          throw "Refusing to update a pre-existing release archive: $archivePath"
        }

        & "$sevenZip" a -t7z -mx=8 -mmt=4 "$archivePath" "$pub\*"
        if ($LASTEXITCODE -ne 0) {
          throw "7-Zip archive creation failed with exit code $LASTEXITCODE."
        }

        $archiveFile = Get-Item -LiteralPath $archivePath
        if ($archiveFile.PSIsContainer -or
            (($archiveFile.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) -or
            $archiveFile.Length -le 0) {
          throw "7-Zip must produce one non-empty regular archive file."
        }

        & "$sevenZip" t "$archivePath"
        if ($LASTEXITCODE -ne 0) {
          throw "7-Zip archive integrity test failed with exit code $LASTEXITCODE."
        }

        $sha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($sha256 -notmatch '^[0-9a-f]{64}$') {
          throw "Could not calculate a valid SHA-256 for the release archive."
        }

        [System.IO.File]::AppendAllText(
          $env:GITHUB_OUTPUT,
          "sha256=$sha256$([Environment]::NewLine)size=$($archiveFile.Length)$([Environment]::NewLine)",
          [System.Text.UTF8Encoding]::new($false))
