name: Testing Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Build Commit Hash or ref'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow control source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Stage trusted release validator
        shell: pwsh
        env:
          VALIDATOR_PATH: ${{ runner.temp }}\validate-release-token.ps1
        run: |
          Copy-Item `
            -LiteralPath ".\scripts\codex\validate-release-token.ps1" `
            -Destination "$env:VALIDATOR_PATH" `
            -Force

      - name: Validate requested ref
        id: release-ref
        shell: pwsh
        env:
          REQUESTED_REF: ${{ inputs.commit }}
          VALIDATOR_PATH: ${{ runner.temp }}\validate-release-token.ps1
        run: |
          & "$env:VALIDATOR_PATH" `
            -Kind Ref `
            -Value "$env:REQUESTED_REF" `
            -OutputName value `
            -OutputFile "$env:GITHUB_OUTPUT" | Out-Null

      - name: Get latest stable release tag
        id: latest-tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const latest = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            return latest.data.tag_name;

      - name: Validate stable release tag
        id: stable-tag
        shell: pwsh
        env:
          STABLE_TAG: ${{ steps.latest-tag.outputs.result }}
          VALIDATOR_PATH: ${{ runner.temp }}\validate-release-token.ps1
        run: |
          & "$env:VALIDATOR_PATH" `
            -Kind Tag `
            -Value "$env:STABLE_TAG" `
            -OutputName value `
            -OutputFile "$env:GITHUB_OUTPUT" | Out-Null

      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release-ref.outputs.value }}

      - name: Get short commit hash
        id: short-hash
        shell: pwsh
        env:
          VALIDATOR_PATH: ${{ runner.temp }}\validate-release-token.ps1
        run: |
          $short = (& git rev-parse --short=12 HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the checked-out commit."
          }
          & "$env:VALIDATOR_PATH" `
            -Kind Hash `
            -Value "$short" `
            -OutputName sha `
            -OutputFile "$env:GITHUB_OUTPUT" | Out-Null

      - name: Set archive name
        id: archive-name
        shell: pwsh
        env:
          STABLE_TAG: ${{ steps.stable-tag.outputs.value }}
          SHORT_HASH: ${{ steps.short-hash.outputs.sha }}
          VALIDATOR_PATH: ${{ runner.temp }}\validate-release-token.ps1
        run: |
          $archiveName = "LLPlayer-testing-$env:STABLE_TAG-$env:SHORT_HASH.7z"
          & "$env:VALIDATOR_PATH" `
            -Kind Archive `
            -Value "$archiveName" `
            -OutputName name `
            -OutputFile "$env:GITHUB_OUTPUT" | Out-Null

      - name: Build & Package
        uses: ./.github/actions/build-package
        with:
          archive-name: ${{ steps.archive-name.outputs.name }}

      - name: Upload Testing Asset (overwrite)
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.archive-name.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.0.1 "$env:ARCHIVE_NAME" --clobber
