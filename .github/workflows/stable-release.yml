name: Stable Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  ARCHIVE_NAME: LLPlayer-${{ github.ref_name }}-x64.7z

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Full verification preflight
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\codex\verify.ps1

      - name: Build & Package
        uses: ./.github/actions/build-package
        with:
          archive-name: ${{ env.ARCHIVE_NAME }}

      - name: Create or update GitHub Draft Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          draft: true # created as draft, later published manually
          prerelease: false
          files: ${{ env.ARCHIVE_NAME }}
